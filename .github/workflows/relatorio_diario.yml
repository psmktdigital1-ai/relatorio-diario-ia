name: Relatório diário

# Roda todo dia às 08:00 (horário de Brasília, UTC-3 -> 11:00 UTC).
# Também pode ser disparado manualmente na aba Actions ("Run workflow").
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  gerar-e-enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar e enviar relatório
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python3 main.py

      - name: Salvar relatório como artefato (quando SMTP não está configurado)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-diario
          path: saida/
          if-no-files-found: ignore
